# =============================================================================
# nginx — configuração do site da GHR
# -----------------------------------------------------------------------------
# Copiada para /etc/nginx/conf.d/default.conf pelo Dockerfile. Arquivos em
# conf.d/ são incluídos dentro do bloco `http`, por isso o `map` abaixo pode
# ficar aqui.
#
# TLS, domínio e redirecionamento http->https ficam com o Easypanel (Traefik),
# na frente deste container. Aqui é só o servidor de arquivos.
# =============================================================================

# --- cache por tipo de conteúdo ---------------------------------------------
# Feito com `map` em vez de um `add_header` dentro de cada location de propósito:
# no nginx, um `add_header` dentro de um location APAGA todos os herdados do
# server. Com locations próprios para cache, os cabeçalhos de segurança lá
# embaixo deixariam de valer justamente para CSS, JS e imagens. Assim existe um
# único conjunto de add_header, no nível do server, e o valor do Cache-Control
# vem daqui.
map $sent_http_content_type $ghr_cache {
    # HTML, XML e o resto: sempre revalidar. É o HTML que aponta para a versão
    # nova do CSS e do JS — se ele ficar em cache, a troca de versão não chega.
    default                   "no-cache, must-revalidate";

    # CSS e JS entram com ?v=<numero> (ferramentas/bump-versao.py): mudar o
    # arquivo muda a URL, então dá para guardar por um ano sem servir velho.
    ~*text/css                "public, max-age=31536000, immutable";
    ~*application/javascript  "public, max-age=31536000, immutable";
    ~*text/javascript         "public, max-age=31536000, immutable";

    # Imagens e fontes têm nome fixo. Um mês é o meio-termo entre não rebaixar
    # o carregamento e conseguir trocar uma foto sem esperar um ano.
    ~*^image/                 "public, max-age=2592000";
    ~*^font/                  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # /servicos/ e /contato/ são pastas com index.html dentro.
    index index.html;

    # Não anunciar a versão do nginx no cabeçalho nem na página de erro.
    server_tokens off;

    # =========================================================================
    # 1. BLOQUEIOS — precisam vir ANTES de qualquer outra location com regex.
    # -------------------------------------------------------------------------
    # O nginx testa as locations com regex na ordem em que aparecem e para na
    # primeira que casa. Se as regras de cache viessem primeiro, um pedido a
    # /assets/img/gallery/_originais/ghr-108.jpg casaria com a regra de imagem
    # e seria SERVIDO em vez de recusado.
    #
    # Nada disso deveria existir na imagem: o pacote é montado por lista de
    # permissão (ferramentas/preparar-publicacao.py) e o script falha se achar
    # material bruto. Esta é a segunda tranca — se um dia alguém trocar o
    # Dockerfile por um COPY direto, o servidor continua recusando.
    # =========================================================================
    location ~ /_originais/                                 { return 404; }
    location ~ ^/(ghr_esteticaautomotiva|ferramentas|publicar)/ { return 404; }
    location ~* \.(?:py|pyc|pdf|md|psd|mp4|zip|log)$        { return 404; }
    location ~ /\.                                          { return 404; }

    # =========================================================================
    # 2. COMPRESSÃO
    # -------------------------------------------------------------------------
    # JPG, WebP e PNG já são comprimidos: passar gzip neles gasta CPU e não
    # diminui nada. SVG é texto e comprime bem.
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        text/javascript
        application/json
        application/xml
        image/svg+xml;

    # =========================================================================
    # 3. CABEÇALHOS — um conjunto só, no nível do server (ver o `map` acima).
    # =========================================================================
    add_header Cache-Control $ghr_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # 4. ARQUIVOS
    # =========================================================================
    location / {
        try_files $uri $uri/ =404;
    }

    # Requisições de imagem e CSS/JS não precisam de uma linha no log cada.
    location = /favicon.ico { access_log off; log_not_found off; }
}
